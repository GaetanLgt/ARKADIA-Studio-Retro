<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Canal Arkadia">
  <defs>
    <linearGradient id="trait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00a0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0a0a14"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ff00a0" stroke-width="1.5" opacity="0.6"/>
  <!-- vecteurs : trois axes qui partent du centre -->
  <g stroke="url(#trait)" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="120"/>
    <line x1="256" y1="256" x2="374" y2="324"/>
    <line x1="256" y1="256" x2="138" y2="324"/>
  </g>
  <circle cx="256" cy="256" r="26" fill="#00f0ff"/>
  <circle cx="256" cy="120" r="14" fill="#ff00a0"/>
  <circle cx="374" cy="324" r="14" fill="#ff00a0"/>
  <circle cx="138" cy="324" r="14" fill="#ff00a0"/>
  <text x="256" y="466" text-anchor="middle" font-family="monospace" font-size="46" font-weight="700" fill="#00f0ff" letter-spacing="6">ARKADIA</text>
</svg>
